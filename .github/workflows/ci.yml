name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Exercise the real Keychain on macOS (Windows always runs the DPAPI test).
          PIM_MCP_TEST_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: CLI smoke test
        run: node dist/index.js --help
