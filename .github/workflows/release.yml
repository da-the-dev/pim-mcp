name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + MCP Registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV packages[0]=$SRV_PKG"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "::error::Bump package.json and server.json to $TAG before tagging"
            exit 1
          fi

      - run: npm ci

      - name: Publish to npm
        run: |
          if npm view "pim-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "pim-mcp@${GITHUB_REF_NAME#v} is already on npm; skipping"
          else
            npm publish
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
